schema_version: 1

context:
  name: moonrepo-moon
  version: "2.6.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/moonrepo/moon/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 11536a5c4d1f3a1f95ba35ae319cb4590cc912ff24bfe785ccca5eb22984fbcd

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - libprotobuf
    - if: linux
      then: make

tests:
  - script:
      - moon --help

about:
  summary: Build system for managing codebases
  description: |
    A task runner and monorepo management tool for the web ecosystem, written in Rust.
    Supports JavaScript, TypeScript, Rust, Go, Ruby, and more <https://moonrepo.dev/docs#supported-languages>
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://moonrepo.dev/
  repository: https://github.com/moonrepo/moon
  documentation: https://moonrepo.dev/docs

extra:
  recipe-maintainers:
    - corker
